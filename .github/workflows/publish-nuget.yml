name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  MSBUILDDISABLENODEREUSE: '1'
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  PACKAGE_NAME: Alexaka1.Analyzers.StructuredLogging

jobs:
  build:
    name: Test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Resolve package version
        id: version
        run: |
          set -euo pipefail
          version="$(./build/resolve-release-version.cs "${GITHUB_REF_NAME}")"
          props_version="$(sed -n 's#.*<Version>\([^<]*\)</Version>.*#\1#p' pack/Alexaka1.Analyzers.StructuredLogging/Version.props | head -n 1)"
          if [ "${props_version}" != "${version}" ]; then
            echo "::error::Tag version '${version}' does not match Version.props '${props_version}'."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: >
          dotnet run
          --project test/Alexaka1.Analyzers.StructuredLogging.Tests/Alexaka1.Analyzers.StructuredLogging.Tests.csproj
          -c Release
          --no-launch-profile
          --
          -reporter verbose

      - name: Pack
        run: dotnet pack pack/Alexaka1.Analyzers.StructuredLogging/Package.csproj -c Release -o artifacts

      - name: Upload nupkg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
          overwrite: true

  # Draft, push to NuGet, then publish: immutable releases lock assets and tags.
  # If nuget.org rejects the package, delete the draft and tag before re-tagging the same version.
  draft-release:
    name: Create draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token to create releases
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Download nupkg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: artifacts

      - name: Create changelog for release
        id: changelog
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/changes.md"
          ./build/extract-changelog.cs CHANGELOG.md "${output_file}"
          echo "changes=${output_file}" >> "$GITHUB_OUTPUT"

      - name: Prepare release package
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES_FILE: ${{ steps.changelog.outputs.changes }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.nupkg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No nupkg files found to attach to the release."
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          title="${PACKAGE_NAME} ${VERSION}"
          extra_args=()
          if [[ "${VERSION}" == *-* ]]; then
            extra_args+=(--prerelease)
          else
            extra_args+=(--latest)
          fi

          release_error="${RUNNER_TEMP}/release-view.stderr"
          if ! release_state="$(gh release view "${tag}" --json isDraft --jq '.isDraft' 2>"${release_error}")"; then
            if grep -qF 'release not found' "${release_error}"; then
              release_state=""
            else
              cat "${release_error}" >&2
              exit 1
            fi
          fi
          # The draft asset is the source of truth and may already be on NuGet;
          # never refresh its assets or metadata on a retry.
          if [[ "${release_state}" == "true" ]]; then
            echo "GitHub release ${tag} is a draft; reusing it unchanged."
          elif [[ "${release_state}" == "false" ]]; then
            echo "GitHub release ${tag} is already published; reusing it unchanged."
          else
            ./build/detect-duplicate-release.cs "${VERSION}" "${PACKAGE_NAME}"
            gh release create "${tag}" \
              --draft \
              --title "${title}" \
              --notes-file "${NOTES_FILE}" \
              --generate-notes \
              "${extra_args[@]}" \
              "${files[@]}"
          fi

          gh release download "${tag}" --pattern '*.nupkg' --dir release-package
          release_files=(release-package/*.nupkg)
          if [ ${#release_files[@]} -ne 1 ]; then
            echo "::error::Expected exactly one nupkg in the release."
            exit 1
          fi

          asset_commit="$(unzip -p "${release_files[0]}" "${PACKAGE_NAME}.nuspec" | sed -n 's/.*<repository[^>]* commit="\([^"]*\)".*/\1/p')"
          if [[ -z "${asset_commit}" || "${asset_commit}" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::The release asset was not built from the tagged commit; a stale draft must be deleted before re-tagging."
            exit 1
          fi

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: release-package/*.nupkg
          if-no-files-found: error
          overwrite: true

  publish-nuget:
    name: Push to nuget.org
    needs: draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Download nupkg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: artifacts

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source "$NUGET_SOURCE"
          --skip-duplicate

  publish-release:
    name: Publish GitHub release
    needs: publish-nuget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token to create releases
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          release_state="$(gh release view "${tag}" --json isDraft --jq '.isDraft')"
          if [[ "${release_state}" == "true" ]]; then
            gh release edit "${tag}" --draft=false
          else
            echo "GitHub release ${tag} is already published; leaving it unchanged."
          fi
