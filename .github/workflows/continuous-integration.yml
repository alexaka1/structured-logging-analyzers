name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  test-pack-and-samples:
    name: Test, pack, and build samples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Test
        run: >
          dotnet run
          --project test/Alexaka1.Analyzers.StructuredLogging.Tests/Alexaka1.Analyzers.StructuredLogging.Tests.csproj
          -c Release
          --no-launch-profile

      - name: Pack
        run: dotnet pack pack/Alexaka1.Analyzers.StructuredLogging/Package.csproj -c Release -o artifacts

      - name: Sample TFM matrix
        run: |
          set -euo pipefail
          mkdir -p artifacts

          # ErrorLog is the C# compiler SARIF log. -property values are
          # comma/semicolon lists and use %xx escapes, so URI-encode the
          # entire value (path plus version=2.1).
          # https://learn.microsoft.com/dotnet/csharp/language-reference/compiler-options/errors-warnings#errorlog
          # https://learn.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
          # https://learn.microsoft.com/visualstudio/msbuild/how-to-escape-special-characters-in-msbuild
          build_sample() {
            local project="$1"
            local name="$2"
            local sarif="${PWD}/artifacts/${name}.sarif"
            local errorlog
            errorlog="$(jq -nr --arg v "${sarif},version=2.1" '$v | @uri')"
            dotnet build "$project" -c Release --no-incremental -p:ErrorLog="$errorlog"
          }

          build_sample samples/Net10Example/Net10Example.csproj Net10Example
          build_sample samples/NetStandard20Example/NetStandard20Example.csproj NetStandard20Example
          build_sample samples/Net472Example/Net472Example.csproj Net472Example

      - name: Assert sample build diagnostics
        # Complements PackageAndPerformanceTests so CI fails even if the test
        # host is skipped, using ErrorLog SARIF from the Sample TFM matrix step.
        run: |
          set -euo pipefail
          assert_rule() {
            local sarif="$1"
            local id="$2"
            jq -e --arg id "$id" 'any(.runs[]?.results[]?; .ruleId == $id)' "$sarif"
          }

          assert_rule artifacts/Net10Example.sarif AASL0009
          assert_rule artifacts/Net10Example.sarif AASL0011
          assert_rule artifacts/NetStandard20Example.sarif AASL0009
          assert_rule artifacts/Net472Example.sarif AASL0009

      - name: Upload nupkg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
