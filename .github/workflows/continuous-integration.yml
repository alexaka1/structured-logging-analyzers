name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  test-pack-and-samples:
    name: Test, pack, and build samples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Smoke-test release scripts
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_SOURCE: https://api.nuget.org/v3/index.json
        run: |
          set -euo pipefail
          chmod +x build/*.cs

          version="$(./build/resolve-release-version.cs v1.2.3-preview.1)"
          if [ "${version}" != "1.2.3-preview.1" ]; then
            echo "::error::resolve-release-version.cs printed '${version}', expected '1.2.3-preview.1'."
            exit 1
          fi
          if ./build/resolve-release-version.cs not-a-tag; then
            echo "::error::resolve-release-version.cs accepted an invalid tag."
            exit 1
          fi

          output_file="$(mktemp)"
          ./build/extract-changelog.cs CHANGELOG.md "${output_file}"
          if ! grep -qE '^## [0-9]+\.[0-9]+\.[0-9]' "${output_file}"; then
            echo "::error::extract-changelog.cs did not write a version heading."
            exit 1
          fi

          dotnet build ./build/version.cs --nologo -v:q

          if ./build/detect-duplicate-release.cs v0.1.0-preview.8 0.1.0-preview.8 Alexaka1.Analyzers.StructuredLogging; then
            echo "::error::detect-duplicate-release.cs did not detect the existing GitHub release."
            exit 1
          fi
          if ./build/detect-duplicate-release.cs v0.0.0-script-smoke-test 0.1.0-preview.8 Alexaka1.Analyzers.StructuredLogging; then
            echo "::error::detect-duplicate-release.cs did not detect the existing NuGet package."
            exit 1
          fi
          ./build/detect-duplicate-release.cs v0.0.0-script-smoke-test 0.0.0-script-smoke-test Alexaka1.Analyzers.StructuredLogging

      - name: Test
        run: >
          dotnet run
          --project test/Alexaka1.Analyzers.StructuredLogging.Tests/Alexaka1.Analyzers.StructuredLogging.Tests.csproj
          -c Release
          --no-launch-profile

      - name: Pack
        run: dotnet pack pack/Alexaka1.Analyzers.StructuredLogging/Package.csproj -c Release -o artifacts

      - name: Sample TFM matrix
        run: |
          set -euo pipefail
          build_sample() {
            local project="$1"
            dotnet clean "$project" -c Release
            dotnet build "$project" -c Release --no-incremental -v:minimal \
              -p:ErrorLog='dotnet-build-error.sarif%2cversion=2.1'
          }

          build_sample samples/Net10Example/Net10Example.csproj
          build_sample samples/Net10BlazorExample/Net10BlazorExample.csproj
          build_sample samples/NetStandard20Example/NetStandard20Example.csproj
          build_sample samples/Net472Example/Net472Example.csproj

      - name: Assert sample build diagnostics
        # Complements PackageAndPerformanceTests so CI fails even if the test
        # host is skipped, using the logs from the Sample TFM matrix step.
        run: |
          set -euo pipefail
          assert_aasl() {
            local sarif="$1"
            local expected="$2"
            jq -e --argjson expected "$expected" '
              def key: [.ruleId, .file, .line, .column];
              def actual:
                [
                  .runs[]?.results[]?
                  | select((.suppressions | not) or ((.suppressions | length) == 0))
                  | select(.ruleId | startswith("AASL"))
                  | {
                      ruleId,
                      file: (.locations[0].physicalLocation.artifactLocation.uri | split("/")[-1]),
                      line: .locations[0].physicalLocation.region.startLine,
                      column: .locations[0].physicalLocation.region.startColumn
                    }
                ] | sort_by(key);
              ($expected | sort_by(key)) as $exp
              | if actual == $exp then true
                else error("AASL results mismatch\nexpected: \($exp)\nactual: \(actual)")
                end
            ' "$sarif"
          }

          assert_aasl samples/Net10Example/dotnet-build-error.sarif '[
            {"ruleId":"AASL0009","file":"LogMessages.cs","line":14,"column":31},
            {"ruleId":"AASL0011","file":"LogMessages.cs","line":14,"column":40},
            {"ruleId":"AASL0009","file":"LogMessages.cs","line":17,"column":48},
            {"ruleId":"AASL0009","file":"LogMessages.cs","line":20,"column":29},
            {"ruleId":"AASL0009","file":"LogMessages.cs","line":26,"column":78},
            {"ruleId":"AASL0009","file":"LogMessages.cs","line":36,"column":81},
            {"ruleId":"AASL0009","file":"LogMessages.cs","line":42,"column":83},
            {"ruleId":"AASL0009","file":"LogMessages.cs","line":49,"column":82},
            {"ruleId":"AASL0011","file":"LogMessages.cs","line":49,"column":91},
            {"ruleId":"AASL0009","file":"LogMessages.cs","line":52,"column":50},
            {"ruleId":"AASL0009","file":"Program.cs","line":8,"column":27}
          ]'
          assert_aasl samples/Net10BlazorExample/dotnet-build-error.sarif '[
            {"ruleId":"AASL0009","file":"Counter.razor.cs","line":16,"column":40},
            {"ruleId":"AASL0011","file":"Counter.razor.cs","line":16,"column":47},
            {"ruleId":"AASL0009","file":"Home.razor","line":18,"column":38}
          ]'
          assert_aasl samples/NetStandard20Example/dotnet-build-error.sarif '[
            {"ruleId":"AASL0009","file":"Sample.cs","line":9,"column":39}
          ]'
          assert_aasl samples/Net472Example/dotnet-build-error.sarif '[
            {"ruleId":"AASL0009","file":"Sample.cs","line":9,"column":39}
          ]'

      - name: Upload nupkg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
